stages:
  - test
  - deploy

lint-flake8:
  image: python:3.8-alpine
  stage: test
  tags:
    - ssh-client
  variables:
    FOLDER_NAME: "logs"
    LOG_NAME: "flake8.log"
    CHECKING_FOLDER: "."
  before_script:
    - python -m pip install --upgrade pip
    - pip install flake8 pylint-odoo
    - mkdir -p $FOLDER_NAME
  script:
    - echo "Linting code..."
    - flake8 --tee --output-file=$FOLDER_NAME/$LOG_NAME $CHECKING_FOLDER
    - echo "No lint issues found."
  artifacts:
    when: on_failure
    expire_in: 2 days
    paths:
      - $FOLDER_NAME/

lint-pylint:
  image: python:3.8-alpine
  stage: test
  tags:
    - ssh-client
  variables:
    FOLDER_NAME: "logs"
    LOG_NAME_NM: "pylint-not-mandatory.log"
    LOG_NAME_MN: "pylint-mandatory.log"
    CHECKING_FOLDER: "."
  before_script:
    - python -m pip install --upgrade pip
    - pip install pylint-odoo
    - mkdir -p $FOLDER_NAME
  script:
    - echo "Linting code (non-mandatory)..."
    - pylint --load-plugins=pylint_odoo --rcfile=.pylintrc --exit-zero l10n_ar_* | tee -a
      $FOLDER_NAME/$LOG_NAME_NM
    - echo "Linting code (mandatory)..."
    - pylint --load-plugins=pylint_odoo --rcfile=.pylintrc-mandatory l10n_ar_* | tee -a
      $FOLDER_NAME/$LOG_NAME_MN
  artifacts:
    when: on_failure
    expire_in: 2 days
    paths:
      - $FOLDER_NAME/

# child project deploy
deploy-job: # This job runs in the deploy stage.
  stage: deploy # It only runs when jobs in the test stage complete successfully.
  rules:
    - if: $CI_COMMIT_BRANCH == "17.0-preStable"
  trigger:
    project: localization/l10n-v17-testing
    strategy: depend
